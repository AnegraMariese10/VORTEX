[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
image-path = ../../image

network = multi_server_config


############ # Simulation parameters # ########################################################## 
debug-on-errors = false 
print-undisposed = false 
#sim-time-limit = 300s 
#sim-time-limit = 215s 
#sim-time-limit = 30s 
sim-time-limit = 215s 
**.sctp.**.scalar-recording = false 
**.sctp.**.vector-recording = false 
**.routingRecorder.enabled = false 
**.enableHandover = true 

############ # Simulation parameters # ###########
*.playgroundSizeX = 10000m 
*.playgroundSizeY = 10000m 
*.playgroundSizeZ = 50m 

######## VeinsManager parameters # ########################################################## 
*.veinsManager.host = "localhost" 
# if traci-launchd runs on localhost 
*.veinsManager.moduleType = "simu5g.nodes.cars.NRCar" 
*.veinsManager.moduleName = "car" 
*.veinsManager.launchConfig = xmldoc("inter.launchd.xml") 
*.veinsManager.updateInterval = 0.1s 

############## Mobility # ########################################################## 
*.car[*].mobilityType = "VeinsInetMobility" 


########### # LTE specific parameters # ######### Number of Resource Blocks 
#**.numBands = 50 
# Capacidade do 4G (eNB) em 20 MHz 

**.eNB.cellularNic.phy.numBands = 100 

# Capacidade do 5G (gNB) em 50 MHz 

**.gNB.cellularNic.nrPhy.numBands = 270 

# Transmission Power 

#**.ueTxPower = -2 # in dB #**.eNodeBTxPower = -2 # in dB: #**.microTxPower = -2 # in dB # 20 #**.txDirection = "OMNI" #physical layer parameter # "ANISOTROPIC" #**.txAngle = 0 # #**.targetBler = 0.01 #**.blerShift = 5

 ############### SCTP configuration ################## 
 **.sctp.nagleEnabled = false # if true, transmission of small packets will be delayed on the X2 
 
 **.sctp.enableHeartbeats = false 
 

############### Configuração Dual Conectividade################ 
 
[Config DualConnectivity] 
 
 ############### e/gNodeB configuration ################ 
 # the LTE eNodeB must instantiate the NR PDCP layer to exploit Dual Connectivity # the NR gNodeB comes with NR PDCP layer by default 
*.eNB.nicType = "LteNicEnbD2D" 
*.gNB.nicType = "NRNicEnb" 

*.eNB.cellularNic.LtePdcpRrcType = "LtePdcpRrcEnbD2D" 
*.gNB.cellularNic.LtePdcpRrcType = "NRPdcpRrcEnb" 
 
*.gNB.masterId = 1 
*.eNB.masterId = 2 
 
**.dualConnectivityEnabled = true 
**.cellularNic.phy.enableHandover = true 
 

#CONFIG MARIESE 
[Config geral_config] 
########################################################## # App Layer # ########################################################## #network = multi_server_config_router 
network = multi_server_config 
extends=DualConnectivity 

repeat = 10 
seed-set = ${repetition} 
num-rngs = 10 

*.gNB.masterId = 1 
*.eNB.masterId = 2 


############## PHY layer configuration ############## 

#**.downlink_interference = true 
*.eNB.cellularNic.phy.eNodeBTxPower = 46 
*.gNB.cellularNic.phy.eNodeBTxPower = 46 
*.eNB.cellularNic.phy.enableHandover = true 
*.gNB.cellularNic.phy.enableHandover = true 

*.eNB.cellInfo.broadcastMessageInterval = 1s 
*.gNB.cellInfo.broadcastMessageInterval = 1s 
# eNB will sends broadcast triggers every second 

*.gNB.cellularNic.nrPhy.enableHandover = true 
*.eNB.cellularNic.nrPhy.enableHandover = true 

*.eNB.cellularNic.phy.handoverLatency = 50ms 
*.gNB.cellularNic.phy.handoverLatency = 50ms 


**.enableImplicitChunkSerialization = true 
############## Car configuration ################## 

*.car[*].cellularNic.phy.enableHandover = true 
*.car[*].masterId = 2 
*.car[*].macCellId = 1 
*.car[*].nrMasterId = 1 
*.car[*].nrMacCellId = 1 
*.car[*].numApps = 1 
**.car[*].app[*].sendInterval = 20ms 
**.car[*].app[*].serverAddress = "server1" 
**.car[*].app[*].destPort = 1000 
**.car[*].app[*].localPort = 3000 
**.car[*].app[*].serverPort = 1000 
**.car[*].app[*].packetLen = 600000B 
**.car[*].app[*].obSize = 20MiB 


############## Server configuration ################## # the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps) #**.server*.forwarding = true 
**.server*.numApps = 1 
**.server*.app[*].typename = "SateliteUdpVideoStreamServer" 
**.server*.app[*].localPort = 1000 
**.server*.app[*].serverAddress = "car["+string(ancestorIndex(0))+"]" 

**.server1.app[*].serverPort = 3000 
**.server1.app[*].destPort = 3000 

**.server2.app[*].serverPort = 3000 
**.server2.app[*].destPort = 3000
 
**.server*.app[*].sendInterval = 20ms 
**.server*.app[*].packetLen = 600000B 
**.server*.app[*].obSize = 20MiB #?????? 
#**.server*.app[*].videoSize = 10MiB 
**.server*.mobility.initFromDisplayString = false 
**.server*.app[*].cloudAddress = "cloud" 
**.server*.app[*].cloudPort = 5000 

############## Cloud configuration ################## 
**.cloud.numApps = 1 
**.cloud.app[*].typename = "SateliteUdpVideoStreamCloudServer" 
**.cloud.app[*].localPort = 5000 
**.cloud.app[*].serverPort = 3000 
**.cloud.app[*].messageLength = 600000B 
**.cloud.app[*].sendInterval = 20ms 


 
